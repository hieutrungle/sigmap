base_config: wireless

# Use clipped double-Q learning (from TD3)
num_critic_networks: 2
target_critic_backup_type: min
exp_name: clipq
env_name: wireless-sigmap-v2
actor_learning_rate: 0.001
critic_learning_rate: 0.001

total_steps: 10000
random_steps: 1000
training_starts: 1100

batch_size: 256
replay_buffer_capacity: 10500

discount: 0.99
use_soft_target_update: true
soft_target_update_rate: 0.005

actor_gradient_type: reparametrize
num_critic_updates: 5

use_entropy_bonus: true
temperature: 0.05

action_scale: 1.0

# training parameters
num_train_steps_per_env_step: 5
