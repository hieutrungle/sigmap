base_config: wireless

exp_name: sac_beamforming_hallway_T
env_name: wireless-sigmap-v2

replay_buffer_capacity: 25000
total_steps: 7500
random_steps: 20
training_starts: 25
ep_len: 250

# Training settings
actor_learning_rate: 0.0001
critic_learning_rate: 0.0005
alpha_learning_rate: 0.0002
batch_size: 256
num_train_steps_per_env_step: 15

# Actor-critic configuration
hidden_sizes: [256, 256, 256]
discount: 0.9
ema_decay: 0.95 # soft_target_update_rate
num_critics: 2
num_critic_updates: 2
temperature: 0.05
num_actor_samples: 20
saved_path: "./saved_models/"
seed: 0
